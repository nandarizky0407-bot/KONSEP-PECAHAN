<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Pecahan — Matematika Kelas 4 SD · Kurikulum Merdeka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============ DASAR ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FAF1DF; --ink:#3A2E24; --soft:#8A7A66; --card:#FFFDF8;
  --acc:#E8590C; --sun:#FFC53D; --grn:#2E9E4F; --tea:#0B7285; --red:#D64545;
}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',sans-serif; color:var(--ink); background:var(--paper);
  background-image:radial-gradient(rgba(58,46,36,.08) 1.3px, transparent 1.3px);
  background-size:26px 26px; display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit; color:inherit; cursor:pointer; background:none; border:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
h1,h2,h3,.btn,.fr,.fr-in,.stepper,.pill{font-family:'Baloo 2',cursive}
h2{font-size:clamp(26px,3.4vw,38px); line-height:1.15; margin:6px 0 10px}
h3{font-size:20px; margin-bottom:8px}
.muted{color:var(--soft)}
.lead-p{max-width:760px; margin-bottom:18px; font-size:17px}
.wrap{max-width:1060px; margin:0 auto; padding:26px 22px 60px}
.kicker{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--acc); background:#fff; border:2px solid var(--ink); border-radius:999px; padding:5px 14px; box-shadow:3px 3px 0 var(--ink)}
.hl{background:var(--sun); padding:0 .18em; border-radius:8px; display:inline-block; transform:rotate(-1.2deg)}

/* ============ HEADER / FOOTER ============ */
#appbar{display:flex; align-items:center; gap:16px; padding:10px 18px; background:var(--card); border-bottom:3px solid var(--ink); z-index:50; position:relative}
.brand{display:flex; align-items:center; gap:10px; font-family:'Baloo 2'; font-weight:800; font-size:19px}
.brand .logo{width:34px;height:34px;display:grid;place-items:center;background:var(--acc);color:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:2.5px 2.5px 0 var(--ink)}
.brand-sub{font-family:'Plus Jakarta Sans'; font-weight:600; font-size:11.5px; color:var(--soft); display:block; line-height:1}
.progress{flex:1; height:8px; background:#EDE2CC; border:2px solid var(--ink); border-radius:99px; overflow:hidden}
#progressFill{height:100%; width:0; background:var(--acc); border-radius:99px; transition:width .4s cubic-bezier(.2,.8,.3,1)}
.appbar-right{display:flex; align-items:center; gap:10px}
.star-count{display:inline-flex; align-items:center; gap:6px; font-family:'Baloo 2'; font-weight:800; font-size:16px; background:var(--sun); border:2px solid var(--ink); border-radius:999px; padding:4px 13px; box-shadow:2.5px 2.5px 0 var(--ink)}
.star-count svg{color:var(--acc)}
.menu-btn{width:38px;height:38px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:#fff;box-shadow:2.5px 2.5px 0 var(--ink)}
.menu-btn:active{transform:translate(2px,2px); box-shadow:none}
.menu-panel{position:absolute; top:58px; right:14px; width:290px; max-height:70vh; overflow:auto; background:var(--card); border:2.5px solid var(--ink); border-radius:14px; box-shadow:6px 6px 0 rgba(58,46,36,.85); padding:8px; display:none; z-index:60}
.menu-panel.open{display:block}
.menu-item{display:flex; gap:10px; width:100%; text-align:left; padding:8px 10px; border-radius:9px; font-size:13.5px; font-weight:600}
.menu-item:hover{background:#F6EAD3}
.menu-item .mn{font-family:'Baloo 2'; font-weight:800; color:var(--acc); min-width:22px}
.menu-item.cur{background:var(--sun)}
#navbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 18px; background:var(--card); border-top:3px solid var(--ink)}
.nav-btn{display:inline-flex; align-items:center; gap:7px; font-family:'Baloo 2'; font-weight:700; font-size:16px; border:2.5px solid var(--ink); border-radius:12px; padding:8px 18px; background:#fff; box-shadow:3.5px 3.5px 0 var(--ink); transition:transform .12s}
.nav-btn:hover:not(:disabled){background:var(--sun)}
.nav-btn:active:not(:disabled){transform:translate(3px,3px); box-shadow:none}
.nav-btn:disabled{opacity:.35; cursor:not-allowed}
#navInfo{font-weight:700; font-size:13.5px; color:var(--soft); text-align:center}
#stage{flex:1; overflow-y:auto}
.slide-in{animation:pop .5s cubic-bezier(.2,.85,.3,1.05)}
@keyframes pop{from{opacity:0; transform:translateY(22px) scale(.985)} to{opacity:1; transform:none}}

/* ============ KOMPONEN UMUM ============ */
.card{background:var(--card); border:2.5px solid var(--ink); border-radius:18px; padding:22px; box-shadow:6px 6px 0 rgba(58,46,36,.85)}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:18px}
@media(max-width:840px){.duo{grid-template-columns:1fr}}
.pill{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:14px; border:2px solid var(--ink); border-radius:999px; padding:3px 12px; background:#fff}
.pill.grn{background:#DFF3E4}
.btn{display:inline-flex; align-items:center; gap:9px; font-weight:700; font-size:16.5px; border:2.5px solid var(--ink); border-radius:13px; padding:10px 20px; background:#fff; box-shadow:4px 4px 0 var(--ink); transition:transform .12s}
.btn:hover{background:var(--sun)}
.btn:active{transform:translate(4px,4px); box-shadow:none}
.btn.primary{background:var(--acc); color:#fff}
.btn.primary:hover{background:#D14E08}
.btn.dark{background:var(--ink); color:#FFF3DC}
.btn.dark:hover{background:#52432F}
.btn.big{font-size:19px; padding:13px 26px}

/* Pecahan tampilan */
.fr{display:inline-flex; flex-direction:column; align-items:center; line-height:1.05; font-weight:800}
.fr b{font-size:1em}
.fr i{display:block; width:100%; min-width:1.6em; height:3.5px; background:var(--ink); border-radius:3px; margin:3px 0}
.fr.xl{font-size:44px}
.fr.md{font-size:26px}
.fr-in{display:inline-flex; flex-direction:column; align-items:center; gap:2px}
.fr-in i{height:3.5px; width:76px; background:var(--ink); border-radius:3px; margin:3px 0}
.fr-in input{width:64px; height:50px; text-align:center; font:800 24px 'Baloo 2'; border:2.5px solid var(--ink); border-radius:11px; background:#fff}
.fr-in b{font:800 24px 'Baloo 2'}
.ans-num{width:130px; height:54px; text-align:center; font:800 24px 'Baloo 2'; border:2.5px solid var(--ink); border-radius:12px; background:#fff}
.mix-in{display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin:14px 0 4px}
.eq{font:800 32px 'Baloo 2'}
.whole-big{font:800 46px 'Baloo 2'}
.ans-show{display:inline-flex; align-items:center; gap:8px; background:var(--sun); border:2.5px solid var(--ink); border-radius:11px; padding:5px 12px}
.big-sign{font:800 30px 'Baloo 2'}
.mi-w{width:74px; height:54px; text-align:center; font:800 26px 'Baloo 2'; border:2.5px solid var(--ink); border-radius:12px; background:var(--sun); box-shadow:inset 2px 2px 0 rgba(58,46,36,.15)}
.mi-w:focus{outline:3px solid var(--acc); background:#fff}

/* Stepper */
.stepper{display:inline-flex; align-items:center; gap:10px; background:#fff; border:2.5px solid var(--ink); border-radius:13px; padding:6px 12px; box-shadow:3px 3px 0 var(--ink)}
.st-lab{font-weight:700; font-size:14px}
.st-btn{width:32px; height:32px; display:grid; place-items:center; border:2px solid var(--ink); border-radius:9px; background:var(--sun)}
.st-btn:hover{background:var(--acc); color:#fff}
.st-val{font:800 20px 'Baloo 2'; min-width:26px; text-align:center}

/* Batang pecahan */
.fbar{display:flex; height:40px; margin:12px 0}
.fbar .seg{flex:1; border:2.5px solid var(--ink); margin-left:-2.5px; background:#fff; transition:background .2s}
.fbar .seg:first-child{border-radius:11px 0 0 11px; margin-left:0}
.fbar .seg:last-child{border-radius:0 11px 11px 0}
.fbar .seg.on{background:var(--seg,var(--acc))}
.fbar.live .seg{cursor:pointer}
.fbar.live .seg:not(.on):hover{background:#FBE8D8}
.fbar.small{height:26px}

/* Lingkaran pecahan */
.pie svg{width:min(320px,80vw); height:auto; display:block; margin:0 auto}
.slice{fill:#fff; stroke:var(--ink); stroke-width:2.5; cursor:pointer; transition:fill .2s}
.slice:hover{fill:#F2E7D2}
.slice.on{fill:var(--seg,var(--acc))}

/* Opsi jawaban */
.opt-list{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px}
.opt{display:inline-flex; align-items:center; gap:10px; border:2.5px solid var(--ink); border-radius:13px; background:#fff; padding:9px 15px; font-size:16px; font-weight:600; transition:transform .1s; text-align:left}
.opt:hover{background:#FFF3DC}
.opt.sel{background:var(--sun); box-shadow:3px 3px 0 var(--ink); transform:translate(-1px,-1px)}
.opt.used{opacity:.3; pointer-events:none}
.opt-lab{font-family:'Baloo 2'; font-weight:800; background:var(--ink); color:#FFF3DC; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font-size:14px; flex:none}
.opt.good{background:#DFF3E4; border-color:var(--grn)}
.opt.bad{background:#FBE3E3; border-color:var(--red)}
.multi-note{display:flex; gap:9px; align-items:flex-start; background:#FFF6E3; border:2px dashed var(--soft); border-radius:11px; padding:10px 14px; font-size:14.5px; margin-bottom:12px}
.cb{width:22px; height:22px; border:2.5px solid var(--ink); border-radius:7px; background:#fff; flex:none; display:inline-block}
input:checked + .cb{background:var(--grn); box-shadow:inset 0 0 0 3px #fff}
.cb-opt input{position:absolute; opacity:0; pointer-events:none}
.cb-opt{position:relative}

/* Feedback */
.fb{display:none; margin-top:16px; border-radius:13px; border:2.5px solid var(--ink); padding:13px 16px; font-size:15.5px; line-height:1.55}
.fb.show{display:block; animation:pop .3s ease}
.fb.good{background:#E4F5E8}
.fb.bad{background:#FBE9E9}
.fb.warn{background:#FFF3D6}
.fb-title{display:flex; align-items:center; gap:9px; font-family:'Baloo 2'; font-weight:800; font-size:17px; margin-bottom:6px}
.fb.good .fb-title{color:var(--grn)}
.fb.bad .fb-title{color:var(--red)}
.fb-ex{margin-top:8px; padding-top:8px; border-top:2px dashed rgba(58,46,36,.25); font-size:14.5px}
.q-ctl.locked{pointer-events:none; opacity:.62}

/* Kuis */
.quiz-head{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-top:8px}
.quiz-stat{display:flex; gap:8px}
.quiz-card{margin-top:16px; min-height:250px}
.q-no{font-size:12.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin-bottom:8px}
.q-text{font-size:17.5px; line-height:1.6}
.q-text .cmp-q{display:flex; align-items:center; justify-content:center; gap:clamp(14px,4vw,42px); margin:14px 0 4px}
.cmp-cell{display:flex; flex-direction:column; align-items:center; width:min(200px,34vw)}
.cmp-vs{font:800 42px 'Baloo 2'; color:var(--soft)}
.quiz-foot{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-top:16px; flex-wrap:wrap}
.quiz-actions{display:flex; gap:10px}
.qdots{display:flex; flex-wrap:wrap; gap:6px; max-width:520px}
.dot{width:28px; height:28px; display:grid; place-items:center; font:700 12.5px 'Baloo 2'; border:2px solid var(--ink); border-radius:8px; background:#fff}
.dot.now{background:var(--sun); box-shadow:2px 2px 0 var(--ink)}
.dot.ok{background:var(--grn); color:#fff}
.dot.no{background:var(--red); color:#fff}
.q-fin{text-align:center; padding:22px 8px}
.q-fin svg{color:var(--sun); filter:drop-shadow(2px 2px 0 var(--ink))}
.q-fin h3{font-size:30px; margin:10px 0 4px}
.q-fin p{font-size:17px; margin-bottom:6px}
.fin-star{display:inline-flex; align-items:center; gap:8px; background:var(--sun); border:2.5px solid var(--ink); border-radius:999px; padding:6px 16px; font-weight:800; margin-top:8px}
.q-fin .btn{margin-top:16px}

/* Pembanding arena */
.cmp-arena{display:flex; align-items:center; justify-content:center; gap:clamp(14px,4vw,42px); margin:16px 0}
.cmp-btns{display:flex; justify-content:center; gap:14px; margin-top:14px}
.cmp{width:88px; height:64px; justify-content:center; font:800 30px 'Baloo 2'}
.cmp-sign{font:800 56px 'Baloo 2'; color:var(--soft)}

/* Mengurutkan */
.ord{display:flex; flex-direction:column; gap:16px; margin-top:8px}
.ord-chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.chip-frac{font-size:20px}
.ord-slots{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media(max-width:640px){.ord-slots{grid-template-columns:repeat(2,1fr)}}
.ord-slot{border:2.5px dashed var(--soft); border-radius:13px; min-height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:8px; cursor:pointer; background:#FDFAF2}
.ord-slot.filled{border-style:solid; border-color:var(--ink); background:var(--sun); box-shadow:3px 3px 0 var(--ink)}
.ord-lab{font-size:12px; font-weight:800; text-transform:uppercase; color:var(--soft)}
.ord-slot.filled .ord-lab{color:var(--ink)}
.lt{font:800 22px 'Baloo 2'; margin:0 4px}

/* Tarik garis */
.lm{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:150px; padding:14px 6px}
@media(max-width:720px){.lm{gap:64px}}
.lm-svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.lm-col{display:flex; flex-direction:column; gap:14px; align-items:center}
.lm-card{width:130px; display:flex; justify-content:center; padding:10px; background:#fff; border:2.5px solid var(--ink); border-radius:14px; box-shadow:3.5px 3.5px 0 var(--ink); transition:transform .12s, background .12s}
.lm-card:hover{transform:translate(-1px,-2px)}
.lm-card.sel{background:var(--sun); transform:translate(-2px,-3px)}
.lm-card.linked{background:#FDF6E7}
.lm-card.good{background:#DFF3E4; border-color:var(--grn)}
.lm-card.bad{background:#FBE3E3; border-color:var(--red); animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Cover */
.cover{display:grid; grid-template-columns:1.1fr 1fr; gap:30px; align-items:center; max-width:1060px; margin:0 auto; padding:44px 22px 30px; min-height:100%}
@media(max-width:840px){.cover{grid-template-columns:1fr}}
.cover h1{font-size:clamp(44px,7vw,76px); line-height:1.02; margin:16px 0 14px}
.lede{font-size:18px; max-width:440px; margin-bottom:20px; color:#5C4B3A}
.cover-meta{font-size:13.5px; font-weight:700; color:var(--soft); margin-bottom:24px}
.pie-stage{position:relative; width:min(340px,80vw); margin:0 auto}
.pie-badge{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card); border:2.5px solid var(--ink); border-radius:999px; padding:6px 18px; font:800 24px 'Baloo 2'; box-shadow:3px 3px 0 var(--ink); pointer-events:none}
.hint{text-align:center; font-size:13.5px; color:var(--soft); font-weight:600; margin-top:10px}

/* Kehidupan sehari-hari */
.daily-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:18px}
@media(max-width:840px){.daily-grid{grid-template-columns:1fr}}
.il-card{text-align:center}
.il-stage{min-height:180px; display:flex; align-items:center; justify-content:center}
.cap{font-size:15px; margin-top:6px; line-height:1.5}
.cap .fr{font-size:15px; vertical-align:middle}
.cap .fr i{min-width:1.4em; height:2.5px; margin:1px 0}
.ch-seg{width:62px; height:62px; background:#8C5A33; border:3px solid var(--ink); margin-left:-3px; cursor:pointer; transition:all .2s}
.ch-seg:first-child{border-radius:12px 0 0 12px}
.ch-seg:last-child{border-radius:0 12px 12px 0}
.ch-seg.eaten{background:transparent; border-style:dashed; opacity:.45}
.prompt-card{margin-top:22px; background:var(--sun); }
.prompt-card ol{margin:10px 0 0 20px; display:grid; gap:12px}
.prompt-card li{font-size:16.5px; line-height:1.55; font-weight:600}

/* Tujuan */
.goal-list{display:grid; gap:12px; margin-top:16px}
.goal-item{display:flex; gap:16px; align-items:center; background:var(--card); border:2.5px solid var(--ink); border-radius:15px; padding:14px 18px; box-shadow:5px 5px 0 rgba(58,46,36,.85); font-size:16.5px; line-height:1.5}
.goal-item .num-badge{flex:none; width:44px; height:44px; display:grid; place-items:center; background:var(--acc); color:#fff; border:2.5px solid var(--ink); border-radius:13px; font:800 21px 'Baloo 2'; box-shadow:2.5px 2.5px 0 var(--ink)}

/* Peta materi */
.map-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-top:18px}
.map-card{background:var(--card); border:2.5px solid var(--ink); border-radius:17px; padding:18px; box-shadow:6px 6px 0 rgba(58,46,36,.85); cursor:pointer; transition:transform .15s}
.map-card:hover{transform:translate(-3px,-3px)}
.map-card .mn{font:800 42px 'Baloo 2'; color:var(--acc); line-height:1}
.map-card h3{margin:6px 0 6px; font-size:17.5px}
.map-card p{font-size:13.5px; color:var(--soft); line-height:1.5}
.map-card .go{display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-weight:800; font-size:13.5px; color:var(--ink); border-top:2px dashed var(--soft); padding-top:10px; width:100%}

/* Anatomi */
.anat{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; margin:12px 0}
.anat-lab{background:#FFF6E3; border:2px solid var(--ink); border-radius:12px; padding:10px 12px; font-size:13.5px; position:relative; line-height:1.4}
.anat-lab b{display:block; font-family:'Baloo 2'; font-size:16px}
.anat-lab::after{content:''; position:absolute; top:50%; width:26px; border-top:2.5px dashed var(--soft)}
.anat-lab.l{text-align:right}
.anat-lab.l::after{left:100%}
.anat-lab.r::after{right:100%}
@media(max-width:720px){.anat{grid-template-columns:1fr}.anat-lab::after{display:none}}
.anat-note{text-align:center; font-size:13.5px; color:var(--soft); font-weight:700; margin-top:4px}

/* Narasi benda */
.nar-card{display:grid; grid-template-columns:1.25fr 1fr; gap:22px; margin-top:16px}
@media(max-width:840px){.nar-card{grid-template-columns:1fr}}
.nar-visual{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-content:center; min-height:250px}
.grp{display:flex; gap:8px; padding:10px; border:2.5px dashed transparent; border-radius:14px; transition:border-color .4s}
.grp.sep{border-color:var(--soft)}
.ape{width:58px; height:58px; border-radius:12px; transition:background .15s}
.ape.pick:hover{background:#FBE8D8}
.ape svg{width:100%; height:100%}
.apple .ap-b{fill:#EDE4D3; stroke:var(--ink); stroke-width:2; transition:fill .25s}
.apple .ap-s{stroke:#7A5230; stroke-width:3; fill:none; stroke-linecap:round}
.apple .ap-l{fill:#B9AE99; stroke:var(--ink); stroke-width:1.5; transition:fill .25s}
.ape.on .ap-b{fill:#D64545}
.ape.on .ap-l{fill:var(--grn)}
.nar-side{display:flex; flex-direction:column; gap:12px}
.nar-step{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--acc)}
.nar-text{font-size:16.5px; line-height:1.6; min-height:120px}
.nar-act{display:flex; gap:10px; flex-wrap:wrap}
.star-grid{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:16px 0}
.sstar{width:56px; height:56px; cursor:pointer; transition:transform .12s}
.sstar:hover{transform:scale(1.12) rotate(-6deg)}
.sstar svg{width:100%; height:100%}
.sstar .st-b{fill:#fff; stroke:var(--ink); stroke-width:1.6; transition:fill .2s}
.sstar.on .st-b{fill:var(--sun)}
.third-lab{display:inline-flex; background:var(--sun); border:2px solid var(--ink); border-radius:10px; padding:3px 10px; font:800 18px 'Baloo 2'; margin:8px auto 0}

/* Senilai */
.eq-demo{display:flex; align-items:center; justify-content:center; gap:clamp(8px,2vw,20px); flex-wrap:wrap; background:#FFF6E3; border:2px dashed var(--soft); border-radius:14px; padding:16px; margin:14px 0}
.eq-col{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:200px}
.eq-den-chips{display:flex; gap:6px; justify-content:center; margin-bottom:6px; flex-wrap:wrap}
.dchip{border:2px solid var(--ink); background:#fff; border-radius:999px; padding:3px 12px; font:700 14px 'Baloo 2'}
.dchip.sel{background:var(--sun); box-shadow:2px 2px 0 var(--ink)}
.eq-count{font-size:13px; color:var(--soft); font-weight:700; margin-top:2px}
.eq-status{margin-top:16px; text-align:center; border:2.5px solid var(--ink); border-radius:14px; padding:14px; font-size:17px; background:#FDF8EC; transition:background .3s}
.eq-status.hit{background:#DFF3E4}
.eq-status .fr{font-size:22px; vertical-align:middle}
.eq-status .fr i{min-width:1.4em; height:2.5px; margin:1px 0}

/* Per = bagi */
.per-hero{display:flex; align-items:center; justify-content:center; gap:clamp(14px,3vw,30px); flex-wrap:wrap; margin:14px 0}
.per-card{background:var(--sun); border:2.5px solid var(--ink); border-radius:16px; padding:14px 22px; font:800 30px 'Baloo 2'; box-shadow:4px 4px 0 var(--ink); text-align:center}
.per-card small{display:block; font:700 13px 'Plus Jakarta Sans'; letter-spacing:.05em; text-transform:uppercase}
.rule-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:16px 0}
@media(max-width:760px){.rule-cards{grid-template-columns:1fr}}
.rule-cards .card{padding:16px; font-size:14.5px; line-height:1.55}
.rule-cards .rc-t{display:flex; align-items:center; gap:9px; font-family:'Baloo 2'; font-weight:800; font-size:16.5px; margin-bottom:6px}
.rule-cards .rc-t .ric{width:34px;height:34px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;color:#fff}

/* Campuran viz */
.mv-rows{display:flex; flex-direction:column; gap:10px; align-items:center; margin:16px 0}
.mv-row{display:flex; align-items:center; gap:10px}
.mv-lab{font:800 15px 'Baloo 2'; min-width:52px; text-align:right; color:var(--soft)}
.mv-cells{display:flex}
.mv-cell{width:40px; height:40px; border:2.5px solid var(--ink); margin-left:-2.5px; background:#fff; transition:background .2s}
.mv-cell:first-child{border-radius:10px 0 0 10px}
.mv-cell:last-child{border-radius:0 10px 10px 0}
.mv-cell.on{background:var(--tea)}
.step-line{background:#FFF6E3; border:2px dashed var(--soft); border-radius:12px; padding:11px 15px; font-size:15.5px; margin-top:10px; line-height:1.6}
.step-line .fr{font-size:16px; vertical-align:middle}
.step-line .fr i{min-width:1.3em; height:2.5px; margin:1px 0}

/* Kesimpulan */
.sum-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-top:18px}
.sum-card{display:flex; gap:14px; align-items:flex-start}
.sum-card .sic{flex:none; width:44px; height:44px; display:grid; place-items:center; border:2.5px solid var(--ink); border-radius:13px; color:#fff; box-shadow:3px 3px 0 var(--ink)}
.sum-card p{font-size:14.5px; line-height:1.55}
.sum-card b{font-family:'Baloo 2'; display:block; margin-bottom:3px; font-size:16px}

/* Refleksi */
.mood-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px}
.mood-btn{display:flex; flex-direction:column; align-items:center; gap:7px; border:2.5px solid var(--ink); border-radius:15px; background:#fff; padding:13px 17px; font-weight:700; font-size:13.5px; box-shadow:3.5px 3.5px 0 var(--ink); transition:transform .12s}
.mood-btn:hover{transform:translate(-2px,-2px)}
.mood-btn.sel{background:var(--sun)}
.mood-btn svg{width:42px; height:42px}
.refl-q{margin-top:18px}
.refl-q label{display:block; font-weight:700; margin-bottom:7px}
.refl-area{width:100%; min-height:74px; border:2.5px solid var(--ink); border-radius:13px; padding:11px 14px; font:500 15px 'Plus Jakarta Sans'; background:#fff; resize:vertical}

/* Terima kasih */
.thx{position:relative; overflow:hidden; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px}
.thx h1{font-size:clamp(40px,6vw,64px); margin:14px 0}
.cf{position:absolute; top:-60px; animation:fall linear infinite; pointer-events:none; opacity:.9}
@keyframes fall{to{transform:translateY(115vh) rotate(560deg)}}

/* Toast */
#toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,150%); display:flex; align-items:center; gap:10px; background:var(--ink); color:#FFF3DC; font-family:'Baloo 2'; font-weight:700; font-size:16.5px; border-radius:14px; padding:12px 22px; border:2.5px solid var(--ink); box-shadow:5px 5px 0 rgba(58,46,36,.35); transition:transform .35s cubic-bezier(.2,.9,.3,1.2); z-index:100}
#toast.show{transform:translate(-50%,0)}
#toast svg{color:var(--sun)}
</style>
</head>
<body>

<header id="appbar">
  <div class="brand">
    <span class="logo" id="brandLogo"></span>
    <span>Petualangan Pecahan<span class="brand-sub">Matematika · Kelas 4 SD · Kurikulum Merdeka</span></span>
  </div>
  <div class="progress"><div id="progressFill"></div></div>
  <div class="appbar-right">
    <span class="star-count" id="starBox"></span>
    <button class="menu-btn" id="menuBtn" title="Daftar slide"></button>
    <div class="menu-panel" id="menuPanel"></div>
  </div>
</header>

<main id="stage"><section id="slideWrap"></section></main>

<footer id="navbar">
  <button class="nav-btn" id="prevBtn"></button>
  <div id="navInfo"></div>
  <button class="nav-btn" id="nextBtn"></button>
</footer>

<div id="toast"></div>

<script>
/* ================= UTIL & IKON ================= */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const fracHTML=(n,d,cls='')=>`<span class="fr ${cls}"><b>${n}</b><i></i><b>${d}</b></span>`;
const F=(s,cls)=>fracHTML(...String(s).split('/'),cls);
const barStatic=(den,on,cls='')=>`<div class="fbar ${cls}">${Array.from({length:den},(_,i)=>`<div class="seg ${i<on?'on':''}"></div>`).join('')}</div>`;

const ICONS={
 star:'<path fill="currentColor" stroke="none" d="M12 2.4l2.9 5.9 6.5 1-4.7 4.5 1.1 6.5L12 17.2l-5.8 3.1 1.1-6.5L2.6 9.3l6.5-1z"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 chl:'<path d="M15 18l-6-6 6-6"/>',
 chr:'<path d="M9 18l6-6-6-6"/>',
 arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.4c.8.7 1 1.6 1 2.6h6c0-1 .2-1.9 1-2.6A6 6 0 0012 3z"/>',
 book:'<path d="M4 20V6a2 2 0 012-2h14v14H6a2 2 0 00-2 2zm0 0a2 2 0 002 2h14"/>',
 pencil:'<path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"/>',
 refresh:'<path d="M20 11A8 8 0 105.7 6.6M20 4v5h-5"/>',
 trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 5H4a3 3 0 003 4M17 5h3a3 3 0 01-3 4"/>',
 minus:'<path d="M5 12h14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 heart:'<path fill="currentColor" stroke="none" d="M12 21S3 14 3 8.4A4.4 4.4 0 0112 6a4.4 4.4 0 019 2.4C21 14 12 21 12 21z"/>',
 smile:'<circle cx="12" cy="12" r="9"/><path d="M8.3 13.6a4.8 4.8 0 007.4 0M9 9.4h.01M15 9.4h.01"/>',
 meh:'<circle cx="12" cy="12" r="9"/><path d="M8.3 15.4h7.4M9 9.4h.01M15 9.4h.01"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.4 9.2a2.6 2.6 0 114.2 2.1c-.9.7-1.6 1.1-1.6 2.3M12 17h.01"/>',
 frown:'<circle cx="12" cy="12" r="9"/><path d="M16 16.2a5.4 5.4 0 00-8 0M9 9.4h.01M15 9.4h.01"/>',
 wand:'<path d="M15 4V2M15 10V8M11.5 6h-2M20.5 6h-2M18 3.2l1.4-1.4M12 3.2L10.6 1.8M18 8.8l1.4 1.4M12 8.8l-1.4 1.4M3 21l9.5-9.5"/>',
 pie:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l7.8 4.5"/>',
 flag:'<path d="M5 21V4M5 4h11l-2.5 3.5L16 11H5"/>'
};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;

let toastT;
function toast(msg,icon='check'){
  const t=$('#toast'); t.innerHTML=ic(icon)+`<span>${msg}</span>`;
  t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ================= STATE GLOBAL ================= */
const APP={stars:0, awards:{}};
function renderStars(){$('#starBox').innerHTML=ic('star',18)+`<span>${APP.stars}</span>`;}
function award(key,ratio){
  if(ratio>=0.8&&!APP.awards[key]){APP.awards[key]=1;APP.stars++;renderStars();toast('Bintang latihan baru diperoleh! Kamu hebat!','star');}
}

/* ================= GEOMETRI LINGKARAN ================= */
function slicePath(cx,cy,r,i,n){
  const a0=-Math.PI/2+i*2*Math.PI/n, a1=a0+2*Math.PI/n;
  const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
  const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
  return `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function renderPie(el,den,onSet,color){
  let inner;
  if(den===1) inner=`<circle class="slice ${onSet.has(0)?'on':''}" data-i="0" cx="100" cy="100" r="93"/>`;
  else inner=Array.from({length:den},(_,i)=>`<path class="slice ${onSet.has(i)?'on':''}" data-i="${i}" d="${slicePath(100,100,93,i,den)}"/>`).join('');
  el.innerHTML=`<svg viewBox="0 0 200 200" style="--seg:${color}">${inner}</svg>`;
}
function renderBar(el,den,onSet,color){
  el.innerHTML=`<div class="fbar live" style="--seg:${color};width:100%">${Array.from({length:den},(_,i)=>`<div class="seg ${onSet.has(i)?'on':''}" data-i="${i}"></div>`).join('')}</div>`;
}
function makeStepper(label,min,max,val,cb){
  const el=document.createElement('div'); el.className='stepper';
  el.innerHTML=`<span class="st-lab">${label}</span><button class="st-btn" data-d="-1">${ic('minus',16)}</button><span class="st-val">${val}</span><button class="st-btn" data-d="1">${ic('plus',16)}</button>`;
  const vEl=el.querySelector('.st-val'); let v=val;
  el.querySelectorAll('.st-btn').forEach(b=>b.onclick=()=>{
    const nv=Math.min(max,Math.max(min,v+ +b.dataset.d));
    if(nv!==v){v=nv;vEl.textContent=v;cb(v);}
  });
  return {el,set:nv=>{v=nv;vEl.textContent=v;cb(v);}};
}
const appleSVG=`<svg class="apple" viewBox="0 0 40 40"><path class="ap-b" d="M20 12 C 10 4, 2 12, 5 22 C 8 33, 15 38, 20 36 C 25 38, 32 33, 35 22 C 38 12, 30 4, 20 12 Z"/><path class="ap-s" d="M20 12 C 20 8, 21 6, 23 4"/><path class="ap-l" d="M23 7 C 28 3.5, 32.5 5.5, 33.5 8.5 C 29.5 10.5, 25 9.5, 23 7 Z"/></svg>`;
const starSVG=`<svg viewBox="0 0 24 24"><path class="st-b" d="M12 2.4l2.9 5.9 6.5 1-4.7 4.5 1.1 6.5L12 17.2l-5.8 3.1 1.1-6.5L2.6 9.3l6.5-1z"/></svg>`;
const cmpQHTML=(a,b)=>{
  const [na,da]=a.split('/'),[nb,db]=b.split('/');
  return `<div class="cmp-q"><div class="cmp-cell">${fracHTML(na,da,'xl')}${barStatic(+da,+na)}</div><div class="cmp-vs">?</div><div class="cmp-cell">${fracHTML(nb,db,'xl')}${barStatic(+db,+nb)}</div></div>`;
};

/* ================= MESIN KUIS ================= */
const Q={
 frac:{
  controls:()=>`<div class="fr-in"><input class="fi-n" inputmode="numeric" maxlength="3" placeholder="?"><i></i><input class="fi-d" inputmode="numeric" maxlength="3" placeholder="?"></div>`,
  read:b=>{const n=b.querySelector('.fi-n').value.trim(),d=b.querySelector('.fi-d').value.trim();return(n&&d)?`${parseInt(n,10)}/${parseInt(d,10)}`:''},
  ok:(it,v)=>v===it.answer,
  show:it=>`<span class="ans-show">${F(it.answer)}</span>`,
  done:b=>b.querySelector('.fi-n').value.trim()!==''&&b.querySelector('.fi-d').value.trim()!==''
 },
 input:{
  controls:()=>`<input class="ans-num" inputmode="numeric" maxlength="4" placeholder="0">`,
  read:b=>b.querySelector('.ans-num').value.trim(),
  ok:(it,v)=>v!==''&&parseInt(v,10)===it.answer,
  show:it=>`<span class="ans-show big-sign">${it.answer}</span>`,
  done:b=>b.querySelector('.ans-num').value.trim()!==''
 },
 fracq:{
  controls:it=>{
    const np=it.pos==='n'?`<input class="fi-n" inputmode="numeric" maxlength="3" placeholder="?">`:`<b>${it.num}</b>`;
    const dp=it.pos==='d'?`<input class="fi-d" inputmode="numeric" maxlength="3" placeholder="?">`:`<b>${it.den}</b>`;
    return `<div class="mix-in"><span class="whole-big">${it.whole}</span><span class="eq">=</span><span class="fr-in"><span class="fr-part">${np}</span><i></i><span class="fr-part">${dp}</span></span></div>`;
  },
  read:b=>{const i=b.querySelector('input');return i&&i.value.trim()!==''?String(parseInt(i.value,10)):''},
  ok:(it,v)=>v!==''&&parseInt(v,10)===it.answer,
  show:it=>`<span class="ans-show">${it.pos==='n'?F(it.answer+'/'+it.den):F(it.num+'/'+it.answer)}</span>`,
  done:b=>{const i=b.querySelector('input');return i&&i.value.trim()!==''}
 },
 choice:{
  controls:it=>`<div class="opt-list">${it.options.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="opt-lab">${String.fromCharCode(65+k)}</span><span class="opt-body">${o}</span></button>`).join('')}</div>`,
  read:b=>b._sel==null?'':String(b._sel),
  ok:(it,v)=>v===String(it.answer),
  show:it=>`<span class="ans-show">${it.options[it.answer]}</span>`,
  after:b=>{b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{b.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');b._sel=+o.dataset.k;});},
  done:b=>b._sel!=null
 },
 multi:{
  controls:it=>`<p class="multi-note">${ic('bulb',18)}<span>Pilih <b>semua</b> jawaban yang benar — bisa lebih dari satu!</span></p><div class="opt-list">${it.options.map((o,k)=>`<label class="opt cb-opt"><input type="checkbox" data-k="${k}"><span class="cb"></span><span class="opt-body">${o}</span></label>`).join('')}</div>`,
  read:b=>[...b.querySelectorAll('input:checked')].map(x=>+x.dataset.k).sort((a,c)=>a-c).join(','),
  ok:(it,v)=>v===it.answer.join(','),
  show:it=>`<span class="ans-show">${it.answer.map(k=>it.options[k]).join(' &nbsp;')}</span>`,
  done:b=>b.querySelectorAll('input:checked').length>0
 },
 /* ===== FIX UTAMA: field jawaban kini bernama jelas & terpisah dari soal.
    it.n & it.d = pembilang/penyebut SOAL (pecahan biasa).
    it.aw = bilangan utuh JAWABAN, it.an = pembilang JAWABAN.
    (Sebelumnya it.n dipakai ganda sehingga kunci tampil "2 7/3".) ===== */
 mixed:{
  controls:it=>`<div class="mix-in">${fracHTML(it.n,it.d,'xl')}<span class="eq">=</span><input class="mi-w" inputmode="numeric" maxlength="3" placeholder="?"><span class="fr-in"><input class="fi-n" inputmode="numeric" maxlength="3" placeholder="?"><i></i><b>${it.d}</b></span></div>`,
  read:b=>({w:b.querySelector('.mi-w').value.trim(),n:b.querySelector('.fi-n').value.trim()}),
  ok:(it,v)=>parseInt(v.w,10)===it.aw&&parseInt(v.n,10)===it.an,
  show:it=>`<span class="ans-show big-sign">${it.aw}&nbsp;${fracHTML(it.an,it.d)}</span>`,
  done:b=>b.querySelector('.mi-w').value.trim()!==''&&b.querySelector('.fi-n').value.trim()!==''
 },
 improper:{
  controls:it=>`<div class="mix-in"><span class="whole-big">${it.w}</span>&nbsp;${fracHTML(it.n,it.d,'xl')}<span class="eq">=</span><span class="fr-in"><input class="fi-n" inputmode="numeric" maxlength="3" placeholder="?"><i></i><b>${it.d}</b></span></div>`,
  read:b=>b.querySelector('.fi-n').value.trim(),
  ok:(it,v)=>v!==''&&parseInt(v,10)===it.answer,
  show:it=>`<span class="ans-show">${fracHTML(it.answer,it.d)}</span>`,
  done:b=>b.querySelector('.fi-n').value.trim()!==''
 },
 compare:{
  controls:()=>`<div class="cmp-btns"><button type="button" class="opt cmp" data-v="<">&lt;</button><button type="button" class="opt cmp" data-v="=">=</button><button type="button" class="opt cmp" data-v=">">&gt;</button></div>`,
  read:b=>b._sel||'',
  ok:(it,v)=>v===it.answer,
  show:it=>`<span class="ans-show big-sign">${it.answer==='<'?'&lt;':it.answer==='>'?'&gt;':'='}</span>`,
  after:b=>{b.querySelectorAll('.cmp').forEach(o=>o.onclick=()=>{b.querySelectorAll('.cmp').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');b._sel=o.dataset.v;});},
  done:b=>!!b._sel
 },
 order:{
  controls:it=>`<p class="multi-note">${ic('pencil',18)}<span>Klik pecahan satu per satu, mulai dari yang <b>paling kecil</b> sampai <b>paling besar</b>. Klik kotak untuk membatalkan.</span></p>
  <div class="ord"><div class="ord-chips">${it.chips.map((c,k)=>`<button type="button" class="opt chip-frac" data-k="${k}">${fracHTML(...c.split('/'))}</button>`).join('')}</div>
  <div class="ord-slots">${[0,1,2,3].map(k=>`<div class="ord-slot" data-s="${k}"><span class="ord-lab">${['terkecil','ke-2','ke-3','terbesar'][k]}</span><span class="slot-box"></span></div>`).join('')}</div></div>`,
  read:b=>{const p=b._picked||[];return p.length===4?p.map(k=>b._chips[k]).join(','):''},
  ok:(it,v)=>v===it.correct.join(','),
  show:it=>`<span class="ans-show">${it.correct.map(c=>fracHTML(...c.split('/'))).join('<span class="lt">&lt;</span>')}</span>`,
  after:(b,it)=>{
    b._chips=it.chips; b._picked=[];
    const chips=[...b.querySelectorAll('.chip-frac')], slots=[...b.querySelectorAll('.slot-box')];
    const ref=()=>{
      chips.forEach((c,k)=>c.classList.toggle('used',b._picked.includes(k)));
      slots.forEach((s,i)=>{const k=b._picked[i];s.innerHTML=k==null?'':fracHTML(...it.chips[k].split('/'));s.parentElement.classList.toggle('filled',k!=null);});
    };
    chips.forEach((c,k)=>c.onclick=()=>{if(b._picked.length<4&&!b._picked.includes(k)){b._picked.push(k);ref();}});
    slots.forEach((s,i)=>s.onclick=()=>{if(i<b._picked.length){b._picked.splice(i,1);ref();}});
    ref();
  },
  done:b=>(b._picked||[]).length===4
 }
};

function buildQuiz(host,cfg){
  const S={i:0,score:0,checked:false,res:cfg.items.map(()=>null)};
  host.innerHTML=`<div class="wrap">
    <span class="kicker">${cfg.kicker||ic('pencil',16)} Latihan Interaktif</span>
    <div class="quiz-head"><h2>${cfg.title}</h2>
      <div class="quiz-stat"><span class="pill">${ic('book',15)} Soal <b class="q-now">1</b>/${cfg.items.length}</span><span class="pill grn">${ic('check',15)} Benar: <b class="q-sc">0</b></span></div>
    </div>
    ${cfg.intro?`<p class="muted lead-p">${cfg.intro}</p>`:''}
    <div class="card quiz-card">
      <div class="q-no" id="${cfg.id}-no"></div>
      <div class="q-text" id="${cfg.id}-qt"></div>
      <div class="q-ctl" id="${cfg.id}-ctl"></div>
      <div class="fb" id="${cfg.id}-fb"></div>
    </div>
    <div class="quiz-foot">
      <div class="qdots" id="${cfg.id}-dots"></div>
      <div class="quiz-actions">
        <button type="button" class="btn primary" id="${cfg.id}-check">${ic('check')} Periksa</button>
        <button type="button" class="btn dark" id="${cfg.id}-next" style="display:none">Soal Berikutnya ${ic('arr')}</button>
      </div>
    </div>
  </div>`;
  const q=s=>host.querySelector(s);
  const ctl=q('#'+cfg.id+'-ctl'), fb=q('#'+cfg.id+'-fb'),
        checkBtn=q('#'+cfg.id+'-check'), nextBtn=q('#'+cfg.id+'-next');
  const dotsR=()=>{q('#'+cfg.id+'-dots').innerHTML=cfg.items.map((_,k)=>`<span class="dot ${k===S.i?'now':S.res[k]===true?'ok':S.res[k]===false?'no':''}">${k+1}</span>`).join('');};
  function show(){
    const it=cfg.items[S.i], t=Q[it.type];
    S.checked=false;
    q('#'+cfg.id+'-no').textContent=`Soal ${S.i+1} dari ${cfg.items.length}`;
    q('.q-now').textContent=S.i+1;
    q('#'+cfg.id+'-qt').innerHTML=it.q||'';
    ctl.className='q-ctl'; ctl.innerHTML=t.controls(it); ctl._sel=null; ctl._picked=null;
    if(t.after)t.after(ctl,it);
    ctl.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();
      if(S.checked)nextBtn.click(); else check();
    }));
    fb.className='fb'; fb.innerHTML='';
    checkBtn.style.display=''; nextBtn.style.display='none';
    dotsR();
    const f=ctl.querySelector('input'); if(f)f.focus({preventScroll:true});
  }
  function check(){
    if(S.checked)return;
    const it=cfg.items[S.i], t=Q[it.type];
    if(!t)return;
    if(t.done&&!t.done(ctl)){fb.className='fb warn show';fb.innerHTML=`<div class="fb-title">${ic('bulb')} Isi dulu jawabanmu ya!</div>`;return;}
    const ok=!!t.ok(it,t.read(ctl));
    S.checked=true;
    S.res[S.i]=ok; if(ok){S.score++;q('.q-sc').textContent=S.score;}
    ctl.classList.add('locked');
    checkBtn.style.display='none'; nextBtn.style.display='';
    nextBtn.innerHTML=(S.i===cfg.items.length-1?`Lihat Hasil `:`Soal Berikutnya `)+ic('arr');
    fb.className='fb show '+(ok?'good':'bad');
    fb.innerHTML=(ok
      ?`<div class="fb-title">${ic('check')} Benar! Kerja bagus!</div>`
      :`<div class="fb-title">${ic('x')} Belum tepat. Jawaban yang benar: ${t.show(it)}</div>`)
      +(it.e?`<div class="fb-ex"><b>Pembahasan:</b> ${it.e}</div>`:'');
    dotsR();
  }
  function finish(){
    const ratio=S.score/cfg.items.length;
    checkBtn.style.display='none'; nextBtn.style.display='none';
    q('#'+cfg.id+'-qt').innerHTML=''; ctl.innerHTML=''; fb.className='fb';
    q('#'+cfg.id+'-qt').innerHTML=`<div class="q-fin">${ic('trophy',58)}
      <h3>${ratio===1?'Sempurna! Kamu luar biasa!':ratio>=0.8?'Hebat sekali!':ratio>=0.6?'Kerja bagus!':'Ayo pelajari lagi, kamu pasti bisa!'}</h3>
      <p>Kamu menjawab <b>${S.score}</b> dari <b>${cfg.items.length}</b> soal dengan benar.</p>
      ${ratio>=0.8?`<span class="fin-star">${ic('star',18)} Bintang latihan diperoleh!</span>`:''}<br>
      <button type="button" class="btn ghost" id="${cfg.id}-re">${ic('refresh')} Ulangi Latihan</button>`;
    q('#'+cfg.id+'-re').onclick=()=>{S.i=0;S.score=0;S.res=cfg.items.map(()=>null);q('.q-sc').textContent='0';show();};
    award(cfg.id,ratio);
  }
  checkBtn.addEventListener('click',check);
  nextBtn.addEventListener('click',()=>{S.i++;S.i<cfg.items.length?show():finish();});
  show();
}

  const TEXTS=[
   'Perhatikan! Ibu memiliki <b>12 apel</b>. Semua apel ini kita anggap sebagai <b>satu kesatuan utuh</b> — seolah-olah "satu kumpulan apel milik Ibu".',

function buildLineMatch(host){
  const left=['1/2','1/3','2/5','3/4','1/5'];
  const right=shuffle(['2/4','3/15','4/10','6/8','3/9']);
  const COR={'1/2':'2/4','1/3':'3/9','2/5':'4/10','3/4':'6/8','1/5':'3/15'};
  host.innerHTML=`<div class="wrap">
    <span class="kicker">${ic('pencil',15)} Materi 2 · Latihan Menarik Garis</span>
    <h2>Hubungkan Pecahan yang Senilai!</h2>
    <p class="lead-p muted"><b>Klik</b> satu pecahan di sebelah kiri, lalu <b>klik</b> pasangan senilainya di sebelah kanan — garis akan tertarik otomatis. Hubungkan kelima pasangan, lalu tekan Periksa!</p>
    <div class="card">
      <div class="lm" id="lm">
        <svg class="lm-svg" id="lmSvg"></svg>
        <div class="lm-col" id="lmL">${left.map(f=>`<button class="lm-card" data-v="${f}">${F(f,'md')}</button>`).join('')}</div>
        <div class="lm-col" id="lmR">${right.map(f=>`<button class="lm-card" data-v="${f}">${F(f,'md')}</button>`).join('')}</div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">
        <button class="btn primary" id="lmCheck">${ic('check')} Periksa Jawaban</button>
        <button class="btn ghost" id="lmClear">${ic('x')} Hapus Semua Garis</button>
      </div>
      <div class="fb" id="lmFb"></div>
    </div>
  </div>`;
  const lm=host.querySelector('#lm'), svg=host.querySelector('#lmSvg'),
        fb=host.querySelector('#lmFb');
  let selL=null; const lines=[];
  const posOf=c=>{const R=lm.getBoundingClientRect(),r=c.getBoundingClientRect();return{x:r.left-R.left+r.width/2,y:r.top-R.top+r.height/2};};
  function redraw(){
    if(!document.body.contains(lm))return;
    const R=lm.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${R.width} ${R.height}`);
    svg.innerHTML=lines.map(l=>{
      const p=posOf(l.le), q=posOf(l.re);
      return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${l.state==='ok'?'var(--grn)':l.state==='bad'?'var(--red)':'var(--acc)'}" stroke-width="5" stroke-linecap="round"/>`;
    }).join('');
    host.querySelectorAll('#lmL .lm-card').forEach(c=>c.classList.toggle('linked',lines.some(l=>l.l===c.dataset.v)));
    host.querySelectorAll('#lmR .lm-card').forEach(c=>c.classList.toggle('linked',lines.some(l=>l.r===c.dataset.v)));
  }
  host.querySelector('#lmL').addEventListener('click',e=>{
    const c=e.target.closest('.lm-card');if(!c)return;
    host.querySelectorAll('#lmL .lm-card').forEach(x=>x.classList.remove('sel'));
    if(selL===c.dataset.v){selL=null;return;}
    selL=c.dataset.v;c.classList.add('sel');
  });
  host.querySelector('#lmR').addEventListener('click',e=>{
    const c=e.target.closest('.lm-card');if(!c||!selL)return;
    const idx=lines.findIndex(l=>l.l===selL);
    if(idx>=0)lines.splice(idx,1);
    if(!lines.some(l=>l.r===c.dataset.v)){lines.push({l:selL,r:c.dataset.v,le:host.querySelector(`#lmL [data-v="${selL}"]`),re:c,state:null});}
    selL=null;
    host.querySelectorAll('#lmL .lm-card').forEach(x=>x.classList.remove('sel'));
    redraw();
  });
  host.querySelector('#lmClear').onclick=()=>{lines.length=0;redraw();fb.className='fb';};
  host.querySelector('#lmCheck').onclick=()=>{
    if(lines.length<5){fb.className='fb warn show';fb.innerHTML=`<div class="fb-title">${ic('bulb')} Hubungkan semua pasangan dulu ya — perlu 5 garis (baru ${lines.length}).</div>`;return;}
    let ok=0;
    lines.forEach(l=>{const benar=COR[l.l]===l.r;l.state=benar?'ok':'bad';if(benar)ok++;else{l.le.classList.add('bad');l.re.classList.add('bad');}});
    redraw();
    if(ok===5){
      fb.className='fb show good';
      fb.innerHTML=`<div class="fb-title">${ic('check')} Sempurna! Kelima pasangan pecahan senilai berhasil kamu hubungkan!</div>`;
      host.querySelectorAll('.lm-card').forEach(c=>{c.classList.remove('bad');c.classList.add('good');});
      award('lines',1);
    }else{
      fb.className='fb show bad';
      fb.innerHTML=`<div class="fb-title">${ic('x')} ${5-ok} garis masih salah (yang merah). Garis yang salah akan dihapus — coba perbaiki!</div><div class="fb-ex">Ingat: pecahan senilai bisa ditemukan dengan mengalikan atau membagi pembilang <b>dan</b> penyebut dengan bilangan yang sama.</div>`;
      setTimeout(()=>{
        for(let i=lines.length-1;i>=0;i--)if(lines[i].state==='bad'){lines[i].le.classList.remove('bad');lines[i].re.classList.remove('bad');lines.splice(i,1);}
        redraw();
      },1300);
    }
  };
  setTimeout(redraw,50);
  window.addEventListener('resize',redraw);
}

/* ================= SLIDE 16: MEMBANDINGKAN ================= */
function buildCmpPlay(host){
  host.innerHTML=`<div class="wrap">
    <span class="kicker">${ic('target',15)} Materi 5 · Membandingkan Pecahan</span>
    <h2>Mana yang Lebih Besar?</h2>
    <div class="rule-cards">
      <div class="card"><div class="rc-t"><span class="ric" style="background:var(--acc)">${ic('check',18)}</span>Penyebut sama</div>Langsung bandingkan <b>pembilangnya</b>. Pembilang lebih besar = pecahan lebih besar. <i>Contoh: 2/5 &lt; 4/5.</i></div>
      <div class="card"><div class="rc-t"><span class="ric" style="background:var(--grn)">${ic('check',18)}</span>Pembilang sama</div><b>Penyebut lebih kecil</b> berarti potongan lebih besar. <i>Contoh: 1/2 &gt; 1/3, karena potongan per-2 lebih besar daripada per-3.</i></div>
      <div class="card"><div class="rc-t"><span class="ric" style="background:var(--tea)">${ic('check',18)}</span>Penyebut berbeda</div>Ubah dulu menjadi <b>pecahan senilai</b> yang penyebutnya sama, baru bandingkan. <i>Contoh: 2/3 = 4/6, lalu bandingkan dengan 5/6.</i></div>
    </div>
    <div class="card">
      <h3 style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">Arena Tantangan
        <button class="btn" id="cpNew" style="font-size:14.5px;padding:8px 14px">${ic('refresh',16)} Soal Baru</button>
      </h3>
      <div class="cmp-arena" id="cpArena"></div>
      <div class="cmp-btns" id="cpBtns">
        <button class="opt cmp" data-v="<">&lt;</button>
        <button class="opt cmp" data-v="=">=</button>
        <button class="opt cmp" data-v=">">&gt;</button>
      </div>
      <div class="fb" id="cpFb"></div>
    </div>
  </div>`;
  const arena=host.querySelector('#cpArena'), fb=host.querySelector('#cpFb');
  let cur=null;
  function gen(){
    const t=pick(['den','num','eq']);
    if(t==='den'){
      const d=pick([4,5,6,8,10]); let a=ri(1,d-1),b; do{b=ri(1,d-1)}while(b===a);
      cur={A:`${a}/${d}`,B:`${b}/${d}`,ans:a<b?'<':'>',
        why:`Penyebutnya sama, yaitu <b>${d}</b>, jadi cukup bandingkan pembilangnya: ${a} ${a<b?'&lt;':'&gt;'} ${b}.`};
    }else if(t==='num'){
      const n=pick([1,2,3]); let d1=pick([2,3,4,5,6,8]),d2; do{d2=pick([2,3,4,5,6,8])}while(d2===d1);
      const lo=Math.min(d1,d2),hi=Math.max(d1,d2);
      cur={A:`${n}/${d1}`,B:`${n}/${d2}`,ans:d1<d2?'>':d1>d2?'<':'=',
        why:`Pembilangnya sama, yaitu <b>${n}</b>. Penyebut ${lo} lebih kecil dari ${hi}, artinya potongan per-${lo} lebih besar, jadi ${n}/${lo} ${n/d1>n/d2?'&gt;':'&lt;'} ${n}/${hi}.`};
    }else{
      const [fa,fbv,k]=pick([['1/2','2/4',2],['1/3','2/6',2],['1/4','3/12',3],['2/3','4/6',2],['1/5','2/10',2],['3/4','6/8',2],['2/5','4/10',2]]);
      const flip=Math.random()<.5;
      const A=flip?fbv:fa, B=flip?fa:fbv;
      cur={A,B,ans:'=',why:`${A} dan ${B} adalah <b>pecahan senilai</b> — pembilang dan penyebut ${fa} dikalikan ${k} menjadi ${fbv}, jadi gambarnya sama besar.`};
    }
    const [na,da]=cur.A.split('/'),[nb,db]=cur.B.split('/');
    arena.innerHTML=`<div class="cmp-cell">${fracHTML(na,da,'xl')}${barStatic(+da,+na)}</div><div class="cmp-sign">?</div><div class="cmp-cell">${fracHTML(nb,db,'xl')}${barStatic(+db,+nb)}</div>`;
    host.querySelectorAll('#cpBtns .cmp').forEach(x=>x.classList.remove('sel'));
    fb.className='fb';
  }
  host.querySelector('#cpBtns').addEventListener('click',e=>{
    const b=e.target.closest('.cmp'); if(!b||!cur)return;
    host.querySelectorAll('#cpBtns .cmp').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    const ok=b.dataset.v===cur.ans;
    arena.querySelector('.cmp-sign').textContent=cur.ans;
    arena.querySelector('.cmp-sign').style.color=ok?'var(--grn)':'var(--red)';
    fb.className='fb show '+(ok?'good':'bad');
    fb.innerHTML=(ok?`<div class="fb-title">${ic('check')} Tepat!</div>`:`<div class="fb-title">${ic('x')} Belum tepat. Tanda yang benar: <b>${cur.ans==='<'?'&lt;':cur.ans==='>'?'&gt;':'='}</b></div>`)+`<div class="fb-ex"><b>Pembahasan:</b> ${cur.why}</div>`;
  });
  host.querySelector('#cpNew').onclick=gen;
  gen();
}

/* ================= SLIDE 17 & 18: LATIHAN BANDING & URUT ================= */
function buildCmpQuiz(host){
  buildQuiz(host,{id:'qcmp',title:'Latihan Membandingkan Pecahan',kicker:ic('target',15)+' Materi 5',
   intro:'Lihat gambar batangnya bila perlu, lalu pilih tanda <b>&lt;</b>, <b>=</b>, atau <b>&gt;</b> yang tepat.',
   items:CMP_ITEMS.map(s=>({q:s.q,type:'compare',answer:s.answer,e:s.e}))});
}
function buildOrdQuiz(host){
  buildQuiz(host,{id:'qord',title:'Latihan Mengurutkan Pecahan',kicker:ic('target',15)+' Materi 5',
   intro:'Susun keempat pecahan <b>dari yang terkecil sampai terbesar</b> dengan mengkliknya berurutan.',
   items:ORD_ITEMS.map(s=>({q:'',type:'order',chips:s.chips,correct:s.correct,e:s.e}))});
}

/* ================= SLIDE 19: EXIT TICKET ================= */
/* FIX: opsi jawaban diacak setiap latihan; indeks kunci di-remap otomatis
   (semua opsi dalam satu soal unik, sehingga indexOf aman). */
function buildExit(host){
  const items=EXIT_ITEMS.map(s=>{
    const benar=s.options[s.answer];
    const opts=shuffle(s.options);
    return {q:s.q,type:'choice',options:opts,answer:opts.indexOf(benar),e:s.e};
  });
  buildQuiz(host,{id:'qexit',title:'Exit Ticket: Tunjukkan Kamu Bisa!',kicker:ic('flag',15)+' Evaluasi Akhir',
   intro:'10 soal pilihan dari seluruh materi hari ini (urutan opsi diacak). Raih skor 80 ke atas untuk mendapatkan bintang emas!',
   items});
}

/* ================= SLIDE 20: KESIMPULAN ================= */
function buildSummary(host){
  const sums=[
   ['book','var(--acc)','Pecahan = Bagian dari Keseluruhan','Penyebut (bawah) = banyak seluruh bagian sama besar; pembilang (atas) = bagian yang diambil. Contoh: 3/4 dibaca "tiga per empat".'],
   ['star','var(--sun)','Pecahan Bisa Menghitung Benda','1/3 dari 12 benda artinya 12 dibagi 3 kelompok sama banyak = 4 benda. 4/12 senilai dengan 1/3.'],
   ['refresh','var(--grn)','Pecahan Senilai','Kalikan atau bagi pembilang DAN penyebut dengan bilangan yang sama: 1/2 = 2/4 = 4/8. Gambarnya selalu sama besar.'],
   ['pencil','var(--tea)','"Per" Artinya Bagi','3 per 5 = 3 : 5 = 3/5. Setiap bilangan asli n bisa ditulis n/1, dan 3 = 3/1 = 6/2 = 9/3.'],
   ['heart','var(--red)','Pecahan Campuran','Biasa → campuran: bagi (7/3 = 2 1/3). Campuran → biasa: kalikan lalu tambah (2 1/3 = (2×3)+1 = 7/3).'],
   ['trophy','var(--acc)','Membandingkan & Mengurutkan','Penyebut sama? Bandingkan pembilang. Pembilang sama? Penyebut kecil = pecahan besar. Beda semua? Samakan dulu dengan pecahan senilai!']
  ];
  host.innerHTML=`<div class="wrap">
    <span class="kicker">${ic('trophy',15)} Kesimpulan</span>
    <h2>Hari Ini Kamu Sudah Menguasai...</h2>
    <div class="sum-grid">${sums.map(s=>`
      <div class="card sum-card"><span class="sic" style="background:${s[1]}">${ic(s[0],22)}</span>
      <p><b>${s[2]}</b>${s[3]}</p></div>`).join('')}
    </div>
  </div>`;
}

/* ================= SLIDE 21: REFLEKSI ================= */
function buildReflect(host){
  const moods=[['smile','Senang'],['meh','Cukup oke'],['help','Masih bingung'],['frown','Butuh bantuan']];
  host.innerHTML=`<div class="wrap" style="max-width:760px">
    <span class="kicker">${ic('heart',15)} Refleksi</span>
    <h2>Bagaimana Perasaanmu Hari Ini?</h2>
    <div class="card">
      <label style="font-weight:700">Pilih perasaanmu setelah belajar pecahan:</label>
      <div class="mood-row">${moods.map((m,i)=>`<button class="mood-btn" data-i="${i}">${ic(m[0],42)}${m[1]}</button>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="refl-q"><label>1. Bagian mana yang paling kamu sukai hari ini?</label><textarea class="refl-area" placeholder="Tulis di sini..."></textarea></div>
      <div class="refl-q"><label>2. Bagian mana yang masih membuatmu bingung?</label><textarea class="refl-area" placeholder="Tidak apa-apa mengaku bingung, itu tanda mau belajar!"></textarea></div>
      <div class="refl-q"><label>3. Tuliskan satu hal baru yang kamu pelajari tentang pecahan!</label><textarea class="refl-area" placeholder="Misalnya: aku tahu sekarang bahwa 'per' artinya bagi..."></textarea></div>
      <button class="btn primary" id="rfSend" style="margin-top:18px">${ic('check')} Kirim Refleksiku</button>
      <div class="fb" id="rfFb"></div>
    </div>
  </div>`;
  let mood=null;
  host.querySelectorAll('.mood-btn').forEach(b=>b.onclick=()=>{
    host.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); mood=+b.dataset.i;
  });
  host.querySelector('#rfSend').onclick=()=>{
    const fb=host.querySelector('#rfFb');
    if(mood===null){fb.className='fb warn show';fb.innerHTML=`<div class="fb-title">${ic('bulb')} Pilih dulu perasaanmu ya, lalu kirim lagi.</div>`;return;}
    host.querySelectorAll('.card')[1].innerHTML=`<div class="q-fin">${ic('heart',54)}<h3>Terima kasih sudah berefleksi!</h3><p>Perasaan dan ceritamu tadi akan membantu Bu Guru menyiapkan pelajaran yang lebih seru lagi. Sampai jumpa di petualangan berikutnya!</p></div>`;
    toast('Refleksi terkirim. Hebat!','heart');
  };
}

/* ================= SLIDE 22: PENUTUP ================= */
function buildThanks(host){
  const colors=['var(--acc)','var(--sun)','var(--grn)','var(--tea)'];
  let conf='';
  for(let i=0;i<14;i++){
    const c=colors[i%4];
    conf+=`<span class="cf" style="left:${ri(2,96)}%;animation-duration:${ri(5,10)}s;animation-delay:-${ri(0,9)}s">
      <svg viewBox="0 0 24 24" width="${ri(22,38)}" height="${ri(22,38)}"><path d="M12 12 L12 2 A10 10 0 0 1 21.2 7 Z" fill="${c}" stroke="var(--ink)" stroke-width="1.6"/></svg></span>`;
  }
  host.innerHTML=`<div class="thx">
    ${conf}
    <span class="kicker">${ic('star',15)} Petualangan Selesai</span>
    <h1>Terima Kasih<br><span class="hl">untuk Hari Ini!</span></h1>
    <p class="lede" style="max-width:520px;text-align:center">Kamu sudah menjelajah pecahan dari nol sampai bisa membandingkan dan mengurutkannya. <b>Kamu luar biasa!</b></p>
    <span class="star-count" style="font-size:20px;padding:8px 20px">${ic('star',24)} Bintang terkumpul: ${APP.stars}</span>
    <div style="margin-top:26px"><button class="btn primary big" id="thxRe">${ic('refresh')} Ulangi dari Awal</button></div>
  </div>`;
  host.querySelector('#thxRe').onclick=()=>go(0);
}

/* ================= MESIN SLIDE ================= */
const SLIDES=[
 {t:'Sampul',f:buildCover},
 {t:'Pecahan di Sekitar Kita',f:buildDaily},
 {t:'Tujuan Pembelajaran',f:buildGoals},
 {t:'Peta Materi',f:buildMap},
 {t:'Apa Itu Pecahan?',f:buildDef},
 {t:'Membentuk Pecahan: Balok',f:h=>buildShape(h,'bar')},
 {t:'Membentuk Pecahan: Lingkaran',f:h=>buildShape(h,'circle')},
 {t:'Pecahan & Jumlah Benda',f:buildObjects},
 {t:'Dari Cerita ke Pecahan (20 Soal)',f:buildStory},
 {t:'Pecahan Senilai',f:buildEquiv},
 {t:'Latihan: Tarik Garis Senilai',f:buildLineMatch},
 {t:'Pilihan Ganda Kompleks Senilai',f:buildMultiEq},
 {t:'"Per" Artinya Bagi',f:buildPer},
 {t:'Pecahan Campuran',f:buildMixed},
 {t:'Latihan Pecahan Campuran (20 Soal)',f:buildMixedQuiz},
 {t:'Membandingkan Pecahan',f:buildCmpPlay},
 {t:'Latihan Membandingkan (10 Soal)',f:buildCmpQuiz},
 {t:'Latihan Mengurutkan (10 Soal)',f:buildOrdQuiz},
 {t:'Exit Ticket (10 Soal)',f:buildExit},
 {t:'Kesimpulan',f:buildSummary},
 {t:'Refleksi',f:buildReflect},
 {t:'Terima Kasih',f:buildThanks}
];
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  const w=$('#slideWrap');
  w.innerHTML=''; w.classList.remove('slide-in'); void w.offsetWidth;
  SLIDES[cur].f(w); w.classList.add('slide-in');
  $('#progressFill').style.width=(cur/(SLIDES.length-1)*100)+'%';
  $('#navInfo').innerHTML=`<b>${cur+1}</b> / ${SLIDES.length} &nbsp;·&nbsp; ${SLIDES[cur].t}`;
  $('#prevBtn').disabled=cur===0; $('#nextBtn').disabled=cur===SLIDES.length-1;
  buildMenu(); $('#stage').scrollTop=0;
}
function buildMenu(){
  $('#menuPanel').innerHTML=SLIDES.map((s,i)=>`<button class="menu-item ${i===cur?'cur':''}" data-i="${i}"><span class="mn">${i+1}</span><span>${s.t}</span></button>`).join('');
  $('#menuPanel').querySelectorAll('.menu-item').forEach(b=>b.onclick=e=>{e.stopPropagation();go(+b.dataset.i);$('#menuPanel').classList.remove('open');});
}
 $('#menuBtn').onclick=e=>{e.stopPropagation();$('#menuPanel').classList.toggle('open');};
document.addEventListener('click',e=>{if(!$('#menuPanel').contains(e.target))$('#menuPanel').classList.remove('open');});
 $('#prevBtn').onclick=()=>go(cur-1);
 $('#nextBtn').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
});
 $('#brandLogo').innerHTML=ic('pie',19);
 $('#menuBtn').innerHTML=ic('menu',19);
 $('#prevBtn').innerHTML=ic('chl')+' Sebelumnya';
 $('#nextBtn').innerHTML='Berikutnya '+ic('chr');
renderStars();
go(0);
</script>
